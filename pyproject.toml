[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "BLE", "DTZ", "LOG", "TRY"]
ignore = ["B008", "TRY003"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*"]
ignore_missing_imports = true
