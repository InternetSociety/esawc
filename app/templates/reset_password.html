{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
  <div class="row justify-content-center"><div class="col-md-6">
    <h1>Reset password</h1>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form action="/reset-password" method="post" class="card card-body">
      <label class="form-label" for="reset-code">Reset code</label>
      <textarea class="form-control mb-3" id="reset-code" name="code" rows="3" required></textarea>
      <label class="form-label" for="new-reset-password">New password</label>
      <input class="form-control mb-3" id="new-reset-password" name="password" type="password" minlength="8" maxlength="128" required>
      <button class="btn btn-primary" type="submit">Change password</button>
    </form>
  </div></div>
{% endblock %}
