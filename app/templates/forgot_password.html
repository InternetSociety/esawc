{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
  <div class="row justify-content-center"><div class="col-md-6">
    <h1>Forgot password</h1>
    {% if acknowledgement %}
      <div class="alert alert-success" role="alert">If the account is eligible, a reset code has been sent.</div>
    {% endif %}
    <form action="/forgot-password" method="post" class="card card-body">
      <label class="form-label" for="reset-email">Email</label>
      <input class="form-control mb-3" id="reset-email" name="email" type="email" required>
      <button class="btn btn-primary" type="submit">Request reset code</button>
    </form>
  </div></div>
{% endblock %}
