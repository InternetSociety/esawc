{% extends "base.html" %}
{% block title %}Tile cache{% endblock %}
{% block content %}
  <h1>Tile cache</h1>
  <div class="table-responsive"><table class="table table-striped">
    <thead><tr><th>Tile</th><th>File</th><th>Last used</th><th>Expires</th></tr></thead>
    <tbody>{% for tile in tiles %}<tr><td>{{ tile.tile_id }}</td><td>{{ tile.file_path }}</td><td>{{ tile.last_used_at }}</td><td>{{ tile.expires_at }}</td></tr>{% else %}<tr><td colspan="4">No cached tiles.</td></tr>{% endfor %}</tbody>
  </table></div>
{% endblock %}
